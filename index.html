<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pulse Check: is something going on?</title>
<meta property="og:title" content="Pulse Check: is something going on?">
<meta property="og:description" content="A calm, plain-English check on big outages and incidents, so you don't have to watch the news all day.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dommn8r7.github.io/pulse-check/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dommn8r7.github.io/pulse-check/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dommn8r7.github.io/pulse-check/og.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A calm, plain-English check on big outages and incidents, so you don't have to watch the news all day.">
<style>
  :root { --bg:#050816; --text:#eef2ff; --muted:#93a0bd; --line:rgba(120,160,255,.16);
          --green:#22c55e; --yellow:#facc15; --orange:#f97316; --red:#ef4444; --err:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--text); font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh;
         background: radial-gradient(900px 500px at 50% -120px, rgba(60,110,255,.28), transparent 70%), var(--bg); background-attachment:fixed; }
  main { max-width:680px; margin:0 auto; padding:22px 16px 56px; }
  .brand { text-align:center; font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:#7da2ff; margin:0 0 14px; font-weight:700; }
  .badge { --c:var(--err); border-radius:22px; padding:34px 16px 30px; text-align:center; color:#0b1020; background:linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 70%, #000));
           box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 12px 50px color-mix(in srgb, var(--c) 55%, transparent); animation:glow 3.2s ease-in-out infinite; }
  .badge .lvl { font-size:13px; font-weight:800; letter-spacing:.3em; opacity:.8; }
  .badge .lbl { font-size:36px; font-weight:900; letter-spacing:.04em; line-height:1.1; margin-top:6px; }
  .badge.green{--c:var(--green)} .badge.yellow{--c:var(--yellow)} .badge.orange{--c:var(--orange)} .badge.red{--c:var(--red);color:#fff}
  @keyframes glow { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.12)} }
  .scale { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:12px 0 0; }
  .scale span { text-align:center; font-size:11px; font-weight:800; letter-spacing:.12em; padding:7px 0; border-radius:10px; background:var(--c); color:#0b1020; opacity:.22; }
  .scale span.on { opacity:1; box-shadow:0 0 18px color-mix(in srgb, var(--c) 60%, transparent); }
  .scale .green{--c:var(--green)} .scale .yellow{--c:var(--yellow)} .scale .orange{--c:var(--orange)} .scale .red{--c:var(--red);color:#fff}
  .share { display:block; margin:14px auto 0; background:rgba(125,162,255,.14); color:#cfe0ff; border:1px solid rgba(125,162,255,.45); border-radius:999px; padding:11px 26px; font:700 15px system-ui,-apple-system,sans-serif; letter-spacing:.04em; cursor:pointer; }
  .share:active { transform:scale(.97); }
  .tagline { text-align:center; color:#c7d2ee; font-size:16px; margin:18px 0 0; }
  .updated { text-align:center; color:var(--muted); font-size:13px; margin:6px 0 18px; }
  .stale { background:rgba(239,68,68,.15); border:1px solid var(--red); color:#ffd6d3; padding:12px 14px; border-radius:12px; margin-bottom:14px; font-weight:600; }
  .changed { text-align:center; font-size:13px; color:var(--muted); margin-top:-10px; margin-bottom:12px; }
  section { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:14px; backdrop-filter:blur(6px); }
  h2 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:#7da2ff; }
  p { margin:0 0 8px; } p:last-child { margin-bottom:0; }
  .ev { border-top:1px solid var(--line); padding:14px 0; } .ev:first-of-type { border-top:0; padding-top:0; }
  .ev h3 { margin:0 0 6px; font-size:16px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .tag { font-size:12px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--muted); }
  .tag.ok { background:rgba(34,197,94,.18); color:#7fe3a4; } .tag.un { background:rgba(250,204,21,.16); color:#f5d76e; }
  .meta { font-size:14px; color:var(--muted); }
  .links a { display:inline-block; margin:4px 12px 0 0; color:#8db8ff; font-size:14px; word-break:break-all; }
  details { margin-top:4px; } summary { cursor:pointer; color:#7da2ff; font-size:14px; padding:6px 0; }
  .strip { display:flex; gap:4px; align-items:flex-end; height:34px; }
  .strip span { flex:1; min-width:4px; border-radius:4px; background:var(--err); height:100%; }
  .strip .green{background:var(--green)} .strip .yellow{background:var(--yellow)} .strip .orange{background:var(--orange)} .strip .red{background:var(--red)}
  .strip .none{background:rgba(255,255,255,.08)}
  .legend { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }
  .disclaimer { font-size:12.5px; color:var(--muted); text-align:center; margin-top:24px; }
  .note { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main id="app"><div class="badge" id="badge">…</div><p class="updated" id="updated">Loading…</p></main>
<script>
const STALE_MIN = 180; // scans run every 2 hours; allow for GitHub cron delay
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const LABEL = { green:"ALL NORMAL", yellow:"MINOR ISSUES", orange:"WORTH WATCHING", red:"SERIOUS" };
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "";
const fmt = (iso) => iso ? new Date(iso).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" }) : "";

async function load(name) {
  const r = await fetch("data/" + name + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(name + " " + r.status);
  return r.json();
}

function strip(history) {
  // last 24 hours in 12 two-hour slots, oldest to newest
  const now = Date.now(), slots = [];
  for (let i = 11; i >= 0; i--) {
    const end = now - i * 7200e3, start = end - 7200e3;
    const hit = history.filter((h) => { const t = Date.parse(h.t); return t > start && t <= end; }).pop();
    slots.push(hit ? hit.level : "none");
  }
  return slots.map((l, i) => `<span class="${esc(l)}" title="${(11 - i) * 2}h ago: ${esc(l)}"></span>`).join("");
}

function render(s, history) {
  const ageMin = (Date.now() - Date.parse(s.generated_at)) / 60000;
  const stale = ageMin > STALE_MIN || !!s.stale_reason;
  let h = "";
  if (stale) {
    h += `<div class="stale">Out of date: last good check ${esc(fmt(s.generated_at))} (${Math.round(ageMin)} min ago). The scan may have failed, so do not rely on this status.${s.stale_reason ? `<br><span class="note">${esc(s.stale_reason)}</span>` : ""}</div>`;
  }
  h += `<p class="brand">Pulse Check</p><div class="badge ${esc(s.level)}"><div class="lvl">${esc(String(s.level).toUpperCase())}</div><div class="lbl">${esc(LABEL[s.level] || s.level.toUpperCase())}</div></div>`;
  h += `<div class="scale">${["green","yellow","orange","red"].map((l) => `<span class="${l}${l === s.level ? " on" : ""}">${l.toUpperCase()}</span>`).join("")}</div>`;
  h += `<p class="tagline">Is it just me, or is something going on?</p><p class="updated">Last checked: ${esc(fmt(s.generated_at))}</p><button class="share" id="shareBtn" type="button">Share this</button>`;
  if (s.level_changed_from_last_run) h += `<p class="changed">Level changed since last scan</p>`;
  h += `<section><h2>What's going on</h2><p>${esc(s.summary)}</p>${s.guardrail_note ? `<p class="note">${esc(s.guardrail_note)}</p>` : ""}</section>`;

  const fresh = (e) => e.status !== "resolved" || (Date.now() - Date.parse(e.started_at || 0)) < 36 * 3600e3;
  const cur = s.events.filter(fresh), old = s.events.filter((e) => !fresh(e));
  const evHtml = (e) => `<div class="ev"><h3>${esc(e.title)}</h3><div class="tags">
      <span class="tag">${esc(e.category)}</span>
      <span class="tag">${esc(e.status)}</span>
      <span class="tag ${e.confirmed ? "ok" : "un"}">${e.confirmed ? "confirmed" : "unconfirmed"}</span></div>
      <p class="meta">${e.started_at ? "Started " + esc(fmt(e.started_at)) + ". " : ""}${e.impact ? "Affected: " + esc(e.impact) + "." : ""}</p>
      ${e.stated_cause ? `<p class="meta">Stated cause: ${esc(e.stated_cause)}</p>` : ""}
      <div class="links">${e.sources.map((x) => safeUrl(x.url) ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.name || x.url)}</a>` : "").join("")}</div></div>`;
  h += `<section><h2>Happening now (${cur.length})</h2>`;
  if (!cur.length) h += `<p class="meta">Nothing active right now.</p>`;
  h += cur.map(evHtml).join("");
  if (old.length) h += `<details><summary>Earlier, already fixed (${old.length})</summary>${old.map(evHtml).join("")}</details>`;
  h += `</section>`;

  const c = s.connection_assessment;
  const VERDICT = { unrelated:"Looks like separate problems", possibly_related:"Might be connected, not proven", likely_related:"Likely connected", unknown:"Too early to tell" };
  const SURE = { high:"Pretty sure", medium:"Not fully certain", low:"Not very sure" };
  h += `<section><h2>Is this one big problem or separate ones?</h2><p><b>${esc(VERDICT[c.verdict] || "Too early to tell")}.</b> ${esc(SURE[c.confidence] || "Not fully certain")}.</p>
        <p class="meta"><b>Why:</b> ${esc(c.reasoning)}</p>${c.would_change_my_mind ? `<p class="meta"><b>What would change our mind:</b> ${esc(c.would_change_my_mind)}</p>` : ""}</section>`;

  if (s.level !== "green" && s.prep_note) h += `<section><h2>Good to know</h2><p>${esc(s.prep_note)}</p></section>`;

  h += `<section><h2>Last 24 hours</h2><div class="strip">${strip(history)}</div><div class="legend"><span>24h ago</span><span>now</span></div></section>`;
  h += `<p class="disclaimer">A calm summary of public reporting, checked every couple of hours. Not a news service and not an emergency alert system. It can lag real events and cannot prove or rule out an attack. For emergencies, use official channels.</p>`;
  document.getElementById("app").innerHTML = h;
  const SHARE = {
    green: "All normal right now. A calm, plain-English check on whether anything big is going on, so you don't have to watch the news:",
    yellow: "Some minor issues out there right now, nothing alarming. Here's the plain-English version:",
    orange: "Worth keeping an eye on today. Here's what's going on, in plain English:",
    red: "Something serious is going on. Here's a calm, plain-English summary:"
  };
  const btn = document.getElementById("shareBtn");
  if (btn) btn.addEventListener("click", async () => {
    const url = location.origin + location.pathname, text = SHARE[s.level] || SHARE.green;
    try {
      if (navigator.share) { await navigator.share({ title: "Pulse Check", text, url }); return; }
      await navigator.clipboard.writeText(text + " " + url);
      btn.textContent = "Link copied!"; setTimeout(() => { btn.textContent = "Share this"; }, 2000);
    } catch (e) { /* user cancelled the share sheet */ }
  });
}

(async () => {
  try {
    const [s, hist] = await Promise.all([load("status.json"), load("history.json").catch(() => [])]);
    render(s, hist);
  } catch (e) {
    document.getElementById("badge").textContent = "NO DATA YET";
    document.getElementById("updated").textContent = "No scan has run yet, or data could not be loaded.";
  }
})();
</script>
</body>
</html>
